name: Build desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            command: package:mac
            name: macOS-arm64
          - os: windows-latest
            command: package:win
            name: Windows-x64
          - os: ubuntu-latest
            command: package:linux
            name: Linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm run check:host
      - run: npm run test:host
      - run: npm run ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: yanqian-${{ matrix.name }}
          if-no-files-found: error
          path: |
            releases/*.dmg
            releases/*.zip
            releases/*.exe
            releases/*.AppImage
